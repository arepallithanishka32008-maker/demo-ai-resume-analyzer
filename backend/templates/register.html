<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - AI Resume Analyzer</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

<div class="logo-area">

<img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" width="60">

<h1>AI Resume Analyzer</h1>

</div>

<nav>

<a href="/">Home</a>
<a href="/about">About</a>
<a href="/upload">Upload Resume</a>
<a href="/contact">Contact</a>
<a href="/login">Login</a>
<a href="/register">Register</a>

</nav>

</header>

<section class="form-section">

<div style="text-align:center;margin-bottom:20px;">

<img src="{{ url_for('static', filename='images/resume.png') }}" width="120" alt="Register">

</div>

<h2 style="text-align:center;">Create New Account</h2>

<form action="/register" method="POST">

<input
type="text"
name="fullname"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit">

Register

</button>

</form>

<p style="text-align:center;margin-top:20px;">

Already have an account?

<a href="/login">

Login Here

</a>

</p>

</section>

<footer>

<p>

© 2026 AI Resume Analyzer | Developed by Thanishka

</p>

</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
